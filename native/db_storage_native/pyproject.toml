[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "db-storage-native"
version = "0.1.0"
description = "Rust/PyO3 performance helpers for DB Storage Manager"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VoxHash", email = "contact@voxhash.dev" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "db_storage_native"
# Stable ABI (abi3-py310 in Cargo.toml) → cp310-abi3 wheels for 3.10+
