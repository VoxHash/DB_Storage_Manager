# Build optional db-storage-native wheels so end users need no local Rust toolchain.
# Desktop targets only (Linux x86_64 manylinux, Windows x64, macOS Intel + Apple Silicon).
name: Native wheels

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: native/db_storage_native
          target: x86_64
          manylinux: "2_28"
          args: --release --out dist
          sccache: "true"
          rust-toolchain: stable

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: native/db_storage_native/dist/*.whl

      - name: Install wheel and run native tests
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install native/db_storage_native/dist/*.whl
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install pytest cryptography
          python -c "from db_storage_manager.native import is_available, backend_info; assert is_available(), backend_info(); print(backend_info())"
          pytest -v tests/test_native.py

  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build Windows wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: native/db_storage_native
          target: x64
          args: --release --out dist
          sccache: "true"
          rust-toolchain: stable

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: native/db_storage_native/dist/*.whl

      - name: Install wheel and run native tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install native/db_storage_native/dist/*.whl
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install pytest cryptography
          python -c "from db_storage_manager.native import is_available, backend_info; assert is_available(), backend_info(); print(backend_info())"
          pytest -v tests/test_native.py

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build macOS wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: native/db_storage_native
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
          rust-toolchain: stable

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: native/db_storage_native/dist/*.whl

      - name: Install wheel and run native tests
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install native/db_storage_native/dist/*.whl
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install pytest cryptography
          python -c "from db_storage_manager.native import is_available, backend_info; assert is_available(), backend_info(); print(backend_info())"
          pytest -v tests/test_native.py

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: native/db_storage_native
          command: sdist
          args: --out dist
          rust-toolchain: stable

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: native/db_storage_native/dist/*.tar.gz

  release-assets:
    name: Attach native wheels to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-dist
          pattern: wheels-*
          merge-multiple: true

      - name: List assets
        run: find native-dist -type f | sort

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: native-dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
