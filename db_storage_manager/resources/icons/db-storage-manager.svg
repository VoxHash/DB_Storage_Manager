<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DB Storage Manager">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144D38"/>
      <stop offset="100%" stop-color="#0A2E22"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4FFFB"/>
      <stop offset="100%" stop-color="#C8EDE0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Soft inner rim -->
  <rect x="48" y="48" width="416" height="416" rx="80" ry="80" fill="none" stroke="#1B6B4A" stroke-width="8" opacity="0.55"/>
  <!-- Database cylinder body -->
  <path d="M156 188
           C156 148, 256 120, 256 120
           C256 120, 356 148, 356 188
           L356 332
           C356 372, 256 400, 256 400
           C256 400, 156 372, 156 332 Z" fill="url(#cyl)"/>
  <!-- Top ellipse -->
  <ellipse cx="256" cy="188" rx="100" ry="36" fill="#FFFFFF"/>
  <!-- Mid disks -->
  <ellipse cx="256" cy="248" rx="100" ry="30" fill="none" stroke="#1B6B4A" stroke-width="10" opacity="0.35"/>
  <ellipse cx="256" cy="300" rx="100" ry="30" fill="none" stroke="#1B6B4A" stroke-width="10" opacity="0.35"/>
  <!-- Accent rim on middle band -->
  <path d="M164 248 C164 268, 210 286, 256 286 C302 286, 348 268, 348 248"
        fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <!-- Storage vault notch (base accent) -->
  <path d="M232 356 L256 340 L280 356 L280 384 L256 400 L232 384 Z" fill="url(#accent)"/>
  <path d="M244 372 L256 364 L268 372 L256 380 Z" fill="#0A2E22" opacity="0.55"/>
</svg>
