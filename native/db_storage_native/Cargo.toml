[package]
name = "db_storage_native"
version = "0.2.0"
edition = "2021"
description = "High-performance native helpers for DB Storage Manager (compression, checksums, encryption, parallel I/O)"
license = "MIT"
authors = ["VoxHash <contact@voxhash.dev>"]

[lib]
name = "db_storage_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310: one wheel per OS/arch works on CPython 3.10+ (no per-minor rebuild)
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
flate2 = { version = "1.0", default-features = false, features = ["zlib"] }
zstd = "0.13"
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac", "sha2"] }
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
